<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10151d">
  <title>PHONE ID SUDAN</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <header>
    <h1>PHONE ID SUDAN</h1>
    <p>منصة تحليل الأرقام السودانية</p>
  </header>

  <main>

    <section class="search-box">
      <h2>البحث عن رقم هاتف</h2>

      <input
        type="tel"
        id="phone"
        placeholder="أدخل الرقم السوداني"
        autocomplete="off"
      >

      <button id="searchBtn">
        ابدأ البحث
      </button>

      <p id="searchStatus"></p>
    </section>

    <section id="results">

      <div id="analysis"></div>

      <div id="quickResults"></div>

      <div id="deepResults"></div>

    </section>

  </main>

  <footer>
    <p>PHONE ID SUDAN © 2026</p>
    <p>البحث في المعلومات المنشورة علناً فقط</p>
  </footer>

  <script src="/app.js"></script>

</body>
</html>
