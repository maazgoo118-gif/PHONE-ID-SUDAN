<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10151d">

  <title>PHONE ID SUDAN</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <header>
    <h1>PHONE ID SUDAN</h1>
    <p>منصة تحليل الأرقام السودانية</p>
  </header>

  <main>

    <section class="search-box">

      <h2>البحث عن رقم هاتف</h2>

      <input
        type="tel"
        id="phone"
        placeholder="أدخل الرقم السوداني"
        autocomplete="off"
        inputmode="tel"
      >

      <button id="searchBtn" type="button">
        ابدأ البحث
      </button>

      <p id="searchStatus" aria-live="polite"></p>

    </section>

    <section id="analysis" class="results-box"></section>

    <section id="quickResults" class="results-box"></section>

    <section id="deepResults" class="results-box"></section>

  </main>

  <footer>
    <p>PHONE ID SUDAN</p>
    <p>منصة تحليل الأرقام السودانية</p>
  </footer>

  <!-- تحميل النسخة الجديدة من ملف JavaScript -->
  <script src="/app.js?v=2" defer></script>

</body>
</html>
